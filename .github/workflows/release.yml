name: Build & Attach Release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach ZIP to (e.g. v1.3)'
        required: true
        default: 'v1.3'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package KernelSU Module ZIP
        run: |
          chmod +x package.sh *.sh META-INF/com/google/android/update-binary
          ./package.sh
      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(grep -m1 '^version=' module.prop | cut -d= -f2)
          ZIP="Marble-Thermal-Tuner-${VERSION}.zip"
          gh release upload "$TAG" "$ZIP" --clobber
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marble-Thermal-Tuner-ZIP
          path: Marble-Thermal-Tuner-*.zip
