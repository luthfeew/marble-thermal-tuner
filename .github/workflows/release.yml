name: Build & Publish Release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. v1.4)'
        required: true
        default: 'v1.4'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package KernelSU Module ZIP
        run: |
          chmod +x package.sh *.sh META-INF/com/google/android/update-binary
          ./package.sh
      - name: Publish Release & Attach ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(grep -m1 '^version=' module.prop | cut -d= -f2 | tr -d '\r\n')
          ZIP="Marble-Thermal-Tuner-${VERSION}.zip"

          awk -v ver="## ${VERSION}" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md

          if [ ! -s /tmp/release_notes.md ]; then
            echo "Marble Thermal Tuner ${VERSION} for POCO F5 / Redmi Note 12 Turbo (marble) on HyperOS." > /tmp/release_notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "Marble Thermal Tuner ${VERSION}" --notes-file /tmp/release_notes.md
          else
            gh release create "$TAG" "$ZIP" --title "Marble Thermal Tuner ${VERSION}" --notes-file /tmp/release_notes.md
          fi
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marble-Thermal-Tuner-ZIP
          path: Marble-Thermal-Tuner-*.zip
